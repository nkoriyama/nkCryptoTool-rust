# cargo-deny configuration (P1-R7 / P1 commit 5).
#
# Supply-chain policy for nkct. Run locally with:
#   cargo install --locked cargo-deny
#   cargo deny check
#
# Uses the v2 schema (cargo-deny >= 0.14).

[graph]
# Check the dependency graph for all target triples we ship on. Leaving this
# empty would only evaluate the host target and could miss platform-specific
# advisories (e.g. windows-only crates).
all-features = true

[advisories]
version = 2
# Fail on yanked crates; RUSTSEC advisories are reported by default.
yanked = "deny"
# Advisory IDs to consciously ignore go here, each with a one-line rationale.
# Keep in sync with .cargo/audit.toml (that file carries the full rationale).
ignore = [
    # quick-xml DoS (7.5, DoS-only): reachable only via attacker-controlled XML,
    # but it is only pulled transitively for notify-rust (Windows toast XML),
    # iroh->netdev->plist (local macOS system plists), and wayland-scanner
    # (compile-time). The P2P wire path never reaches it. Fix (>=0.41) blocked
    # upstream (plist ^0.39.2 / tauri-winrt-notification ^0.37). Re-check 2026-10-06.
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
]

[licenses]
version = 2
# This project is MIT. Allow MIT plus the permissive licenses common across the
# RustCrypto / tokio / clap dependency trees. Anything outside this set fails
# the check so a copyleft or unknown license can't slip in unnoticed.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "MPL-2.0",
    "CC0-1.0",
    "Unlicense",
    "BSL-1.0",
]
confidence-threshold = 0.8
# Per-crate license clarifications go here if a crate's license metadata is
# ambiguous; none needed today.
exceptions = []

[bans]
# Duplicate versions bloat the binary and widen the attack surface; surface them
# as warnings rather than hard failures so a transitive bump doesn't break CI.
multiple-versions = "warn"
# Wildcard ("*") version requirements are not allowed in our manifests.
wildcards = "deny"
allow = []
deny = []

[sources]
# Only crates.io and explicitly allow-listed git sources are permitted.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
