# `native` is only a fallback for targets without their own section below. Do NOT
# let a cross-compiled artifact inherit it: `native` bakes in the *build host's*
# CPU (e.g. Zen5 AVX-512/VAES), which SIGILLs on a different CPU and is
# irreproducible in CI (the runner's CPU is undefined). Give every distributed
# target an explicit, portable floor.
[build]
rustflags = ["-C", "target-cpu=native"]

# Local Linux dev: full host tuning (this is the machine that runs it).
[target.x86_64-unknown-linux-gnu]
rustflags = [
  "-C", "target-cpu=native",
  "-C", "target-feature=+aes,+ssse3,+avx2,+vaes,+pclmulqdq"
]

# Windows is always cross-compiled here for *other* machines, so pin a portable
# floor instead of inheriting `native`. x86-64-v3 = Haswell+ / Zen1+ (AVX2/BMI2,
# no AVX-512); AES-NI + PCLMULQDQ are effectively universal on x86-64. This makes
# the .exe reproducible and safe to distribute without relying on a RUSTFLAGS env
# override. (crypto provider is `ring`, which ships pregenerated asm — no nasm.)
[target.x86_64-pc-windows-msvc]
rustflags = [
  "-C", "target-cpu=x86-64-v3",
  "-C", "target-feature=+aes,+pclmulqdq",
]

# Reproducible, distributable Linux artifact (static musl). This is the target a
# third party rebuilds to verify a released binary matches public source (no
# injected client-side scanner). Everything here is host-independent:
#   - target-cpu=x86-64-v2 (Nehalem+/Bulldozer+): a portable floor, NOT the build
#     host's CPU — same reasoning as the Windows section. AES-NI + PCLMULQDQ are
#     universal on x86-64-v2.
#   - remap-path-prefix scrubs the two build-time absolute paths that rustc would
#     otherwise embed (panic Location strings). The values below are the FIXED
#     in-container paths (WORKDIR /build, CARGO_HOME /usr/local/cargo) that
#     packaging/Containerfile.repro guarantees, so two container builds embed the
#     identical remapped strings. (A host cross-build uses different paths and is
#     simply not scrubbed — reproducibility is claimed only for the container.)
# Build via packaging/reproducible-build.sh; do NOT rely on host RUSTFLAGS.
[target.x86_64-unknown-linux-musl]
rustflags = [
  "-C", "target-cpu=x86-64-v2",
  "-C", "target-feature=+aes,+pclmulqdq",
  "--remap-path-prefix=/build=nkct",
  "--remap-path-prefix=/usr/local/cargo=cargo",
]

# macOS. Both Apple targets are distributed (the release workflow lipo's them
# into one universal binary), so neither may inherit `[build] target-cpu=native`
# — that would bake the CI runner's CPU into a binary meant for other people's
# machines, the same trap the Windows and musl sections above exist to avoid.
#
# No --remap-path-prefix here: reproducibility is claimed only for the musl
# container build, whose fixed in-container paths make the remapping meaningful.
# A macOS runner has no such fixed paths, so adding the flags would suggest a
# guarantee that is not being made.
#
# apple-m1 is the floor for Apple Silicon, not a choice: there is no shipping
# arm64 Mac older than the M1.
[target.aarch64-apple-darwin]
rustflags = ["-C", "target-cpu=apple-m1"]

# Intel Macs: x86-64-v2 (Nehalem+) matches the musl floor. AES-NI is safe to
# require — every Mac that runs a macOS version this toolchain targets is
# Westmere or later.
[target.x86_64-apple-darwin]
rustflags = [
  "-C", "target-cpu=x86-64-v2",
  "-C", "target-feature=+aes,+pclmulqdq",
]

# arm64 Linux. THE FLOOR HERE IS THE OPPOSITE OF THE x86 ONE, ON PURPOSE.
#
# The x86 sections above require +aes,+pclmulqdq because AES-NI is universal on
# x86-64-v2. The ARM equivalent is not: the ARMv8 Crypto Extensions (AES/PMULL/
# SHA) are OPTIONAL, and the Raspberry Pi does not have them -- neither the Pi
# 4's Cortex-A72 nor the Pi 5's A76 ships them. Requiring them would produce a
# binary that SIGILLs on exactly the hardware this target exists to serve: the
# same trap as `target-cpu=native` baking VAES into an x86 artifact, mirrored.
#
# So: plain ARMv8-A, no crypto extensions. `generic` is also the correct choice
# for a machine that DOES have them -- it costs throughput, not correctness --
# whereas the reverse mistake costs a running program. If a crypto-extension
# variant is ever worth shipping, it belongs beside the VAES one: an opt-in
# build with a startup guard, not the default floor.
#
# Consequence worth knowing: with AES in software, ChaCha20-Poly1305 is the
# faster AEAD on a Pi. `--aead-algo chacha20-poly1305` selects it at runtime.
[target.aarch64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=generic"]

# The static target a future arm64 release artifact would use. Same floor.
# No --remap-path-prefix: reproducibility is claimed only for the x86_64 musl
# container build, whose base image is digest-pinned to that architecture.
[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-cpu=generic"]
