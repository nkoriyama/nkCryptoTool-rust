name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  repo-integrity:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Verify critical source files exist in the tracked tree
      run: bash scripts/check_repo_integrity.sh

  p2p-abstraction-check:
    needs: repo-integrity
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Enforce iroh-crate imports only live in src/p2p/backend/iroh.rs
      run: bash scripts/check_p2p_abstraction.sh

  mls-abstraction-check:
    needs: repo-integrity
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Enforce mls_rs* imports only live in src/group/ (+ gui/group_chat.rs)
      run: bash scripts/check_no_mls_leakage.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [openssl, vendored, rustcrypto, gui]
        # run_tests: the openssl/gui entries link *system* libssl, which on
        # ubuntu-latest cannot perform P256 keygen (EVP_PKEY_Q_keygen fails at
        # runtime — a known runner-env quirk documented in ci.yml). Every test
        # exercising the ECDH handshake/file-transfer therefore panics, so a
        # full `cargo test` can never pass there. These entries are build-only
        # (they verify system-libssl / gui linkage compiles); runtime test
        # coverage is provided by the vendored + rustcrypto entries here and by
        # the vendored `CI / Test (Linux, full)` job.
        include:
          - backend: openssl
            features: ""
            extra_deps: ""
            run_tests: false
          - backend: vendored
            features: "--features backend-openssl-vendored"
            extra_deps: ""
            run_tests: true
          - backend: rustcrypto
            features: "--no-default-features --features backend-rustcrypto"
            extra_deps: ""
            run_tests: true
          - backend: gui
            features: "--features gui,testing"
            extra_deps: "libxcb1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev"
            run_tests: false
    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libfontconfig1-dev \
          libssl-dev \
          pkg-config \
          ${{ matrix.extra_deps }}
    - name: Build
      run: cargo build --verbose ${{ matrix.features }}
    - name: Run tests
      if: matrix.run_tests
      run: cargo test --verbose ${{ matrix.features }}
