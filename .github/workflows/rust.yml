name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always
  # .cargo/config.toml pins the linux-gnu target to `target-cpu=native
  # -Ctarget-feature=+vaes` for local dev. GitHub runners without VAES SIGILL
  # when rustc runs a proc-macro / build script compiled with those flags, so pin
  # CI to a portable floor here (RUSTFLAGS wins over the config; local dev sets no
  # RUSTFLAGS and keeps its native tuning).
  RUSTFLAGS: "-C target-cpu=x86-64-v2"

jobs:
  repo-integrity:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Verify critical source files exist in the tracked tree
      run: bash scripts/check_repo_integrity.sh

  p2p-abstraction-check:
    needs: repo-integrity
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Enforce iroh-crate imports only live in src/p2p/backend/iroh.rs
      run: bash scripts/check_p2p_abstraction.sh

  mls-abstraction-check:
    needs: repo-integrity
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Enforce mls_rs* imports only live in src/group/ (+ gui/group_chat.rs)
      run: bash scripts/check_no_mls_leakage.sh

  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        backend: [openssl, vendored, rustcrypto, gui]
        # run_tests: the openssl/gui entries link *system* libssl, which on
        # ubuntu-latest cannot perform P256 keygen (EVP_PKEY_Q_keygen fails at
        # runtime — a known runner-env quirk documented in ci.yml). Every test
        # exercising the ECDH handshake/file-transfer therefore panics, so a
        # full `cargo test` can never pass there. These entries are build-only
        # (they verify system-libssl / gui linkage compiles); runtime test
        # coverage is provided by the vendored + rustcrypto entries here and by
        # the vendored `CI / Test (Linux, full)` job.
        include:
          - backend: openssl
            features: "--no-default-features --features backend-openssl"
            extra_deps: ""
            run_tests: false
          - backend: vendored
            features: "--no-default-features --features backend-openssl-vendored"
            extra_deps: ""
            run_tests: true
          - backend: rustcrypto
            features: "--no-default-features --features backend-rustcrypto"
            extra_deps: ""
            run_tests: true
          - backend: gui
            features: "--no-default-features --features backend-openssl,gui,testing"
            extra_deps: "libxcb1-dev libxkbcommon-dev libwayland-dev libgtk-3-dev"
            run_tests: false
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libfontconfig1-dev \
          libssl-dev \
          pkg-config \
          ${{ matrix.extra_deps }}
    - name: Build
      run: cargo build --verbose ${{ matrix.features }}
    - name: Run tests
      if: matrix.run_tests
      run: cargo test --verbose ${{ matrix.features }}

  # MLS subsystem (group chat, PQ-FS prekeys, at-rest, redb storage, the
  # MLS<->transport identity binding) lives behind the `mls` feature, which the
  # backend matrix above does not enable — so none of it was covered in CI.
  # This job exercises that pure-Rust (C-free: backend-rustcrypto + redb) path.
  mls-tests:
    needs: repo-integrity
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      # The unconditional dev-dependency `i-slint-backend-testing` pulls
      # fontconfig-sys, which `cargo test` compiles even for --lib, so the build
      # needs fontconfig headers (the mls subsystem crypto itself is C-free).
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends libfontconfig1-dev pkg-config
    - name: Build and test the MLS subsystem
      run: cargo test --verbose --no-default-features --features backend-rustcrypto,mls --lib
