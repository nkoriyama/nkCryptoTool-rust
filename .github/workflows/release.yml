# Tag-driven release: build the distributable binaries, publish a GitHub
# Release, then publish the crate to crates.io.
#
# Triggers: push of a `v*` tag, or workflow_dispatch with the tag to re-run
# (NOT pull_request_target — same F4-X10 rule as ci.yml).
#
# PLATFORM SCOPE
# --------------
# Linux x86_64 (static musl), Linux arm64 (static musl), Windows x86_64, and a
# macOS universal binary. Every one of them is built and tested by a
# release-blocking ci.yml job; nothing ships from a platform CI does not check.
#
# THEY DO NOT ALL CARRY THE SAME GUARANTEE, and the release notes say which is
# which rather than letting the table imply otherwise. The two Linux artifacts
# come out of digest-pinned containers, built twice and asserted byte-identical,
# so a third party can reproduce them. Windows and macOS are built natively on
# runners: verifiable as "what this page published", not as "what went into it".
# Apple's SDK is not redistributable and there is no comparable pinned Windows
# base, which is what rules the container approach out for those two.
#
# THE LINUX ARTIFACT IS THE REPRODUCIBLE ONE
# ------------------------------------------
# It is built by packaging/reproducible-build.sh, the same script a third party
# runs to verify the release, inside the same digest-pinned container. The script
# builds twice with --no-cache and fails if the two results differ, so a release
# cannot be cut from a build that is not reproducible. Only the portable variant
# is released: the VAES variant needs AVX-512 hardware to be worth anything and
# would hit main()'s startup CPUID guard everywhere else, so it stays an opt-in
# local build (docs/guides/REPRODUCIBLE_BUILD.md).
#
# Action pin policy (as ci.yml): widely-trusted first-party/ecosystem actions
# pinned to major version; no third-party actions are used here.
#
# SECRETS
# -------
# `CRATES_IO_TOKEN` is read by the `publish` job only, passed to cargo through
# the environment, and never echoed. Publishing a version to crates.io is
# irreversible -- a version number can never be reused, even after `cargo yank`.
# So that job sits behind the `crates-io` GitHub Environment: configure it with
# a required reviewer, and the release stops there for a human to approve.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to re-release (e.g. v2.1.0)"
        required: true
        type: string

permissions:
  contents: read

# RUSTFLAGS IS SET PER JOB, NEVER WORKFLOW-WIDE
# ---------------------------------------------
# Host (x86_64-unknown-linux-gnu) builds need the ci.yml override: .cargo/config
# pins that target to `target-cpu=native -Ctarget-feature=+vaes` for local dev,
# and a runner without VAES SIGILLs when rustc runs a proc-macro built with it.
#
# The distributed builds must NOT have it. `RUSTFLAGS` replaces the matching
# `[target.*].rustflags` outright rather than adding to it -- and cargo treats
# the variable as *set* even when its value is empty, so `RUSTFLAGS: ""` is not
# a way to opt out, it is the same override with nothing in it. Setting it
# workflow-wide would silently drop the windows-msvc portable floor
# (x86-64-v3 + AES-NI) and the musl `--remap-path-prefix` flags that
# reproducibility depends on. So it is applied to individual host-build jobs and
# steps only, exactly as windows-cross-wine.yml does.

jobs:
  # Everything that can reject the release before any artifact is built.
  guard:
    name: Guard (tag matches version, crate packages cleanly)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve the tag being released
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${INPUT_TAG:-$REF_NAME}"
          case "$TAG" in
            v*) ;;
            *) echo "::error::tag '$TAG' does not start with 'v'"; exit 1 ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ steps.resolve.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-guard

      - name: Install build deps
        run: bash scripts/ci_apt.sh pkg-config libssl-dev

      # A tag that disagrees with Cargo.toml would publish the wrong version to
      # crates.io under the right-looking release page, and crates.io will not
      # let it be taken back. Check before anything is built.
      - name: Assert the tag matches Cargo.toml's version
        env:
          WANT: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          GOT=$(cargo metadata --no-deps --format-version 1 \
                | python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')
          echo "Cargo.toml: $GOT   tag: v$WANT"
          if [ "$GOT" != "$WANT" ]; then
            echo "::error::tag v$WANT does not match Cargo.toml version $GOT"
            exit 1
          fi

      # Fails on a missing required field, a file the `exclude` list should have
      # dropped but did not, and on a package whose extracted source no longer
      # builds. --locked so the published crate resolves to the committed lock.
      - name: cargo publish --dry-run
        run: cargo publish --dry-run --locked

      # The published .crate must not carry the per-run security scan
      # directories, the demo GIFs, or .cargo/config.toml's host-specific
      # rustflags. Cargo.toml's `exclude` handles all three; this asserts it,
      # because the failure is silent and unrecoverable once published.
      # THE FLOOR IS NOT OPTIONAL. `cargo package --list` failing -- a dirty
      # tree, a bad manifest -- leaves an empty file, and grepping an empty file
      # for forbidden paths finds none and reports the crate clean. That is the
      # same fail-open shape as the release-gate finding in F2: a check that
      # vanishes has to be loud. So assert the list is there and plausibly
      # sized before believing anything it says.
      - name: Assert the packaged file list carries nothing it should not
        run: |
          set -euo pipefail
          cargo package --list --locked > pkg-list.txt
          COUNT=$(wc -l < pkg-list.txt)
          echo "packaged files: $COUNT"
          if [ "$COUNT" -lt 100 ]; then
            echo "::error::only $COUNT files listed; the crate has ~150. The listing failed rather than the crate shrinking -- this check cannot run."
            exit 1
          fi
          if grep -nE '^(\.cargo/|android/|docs/demos/|demos/|graphify-out/|scratch/)|CLAUDE-SECURITY|\.gif$' pkg-list.txt; then
            echo "::error::the lines above must not appear in the published crate"
            exit 1
          fi

  linux-musl:
    name: Linux static musl (reproducible, built twice)
    runs-on: ubuntu-latest
    needs: guard
    # Two independent --no-cache container builds of the full dependency tree.
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.tag }}
          # reproducible-build.sh derives SOURCE_DATE_EPOCH from the HEAD commit
          # time, so the commit itself has to be present.
          fetch-depth: 1

      - name: Install podman
        run: bash scripts/ci_apt.sh podman

      - name: Reproducible build (portable variant), asserting A == B
        env:
          VARIANTS: nkct
        run: bash packaging/reproducible-build.sh

      - name: Name the artifact for the release page
        env:
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          mv packaging/out/nkct \
             "packaging/out/nkct-${TAG}-x86_64-unknown-linux-musl"
          rm -f packaging/out/SHA256SUMS
          ls -l packaging/out/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-musl
          path: packaging/out/nkct-*
          if-no-files-found: error

  # Same script, same guarantee, native runner. reproducible-build.sh picks
  # packaging/Containerfile.repro.arm64 from `uname -m`, not from a flag: each
  # Containerfile pins one architecture's base image by digest, and building
  # arm64 under qemu on an x86 host would be both glacial and a different set of
  # inputs than a native builder gets. A third party verifies this artifact the
  # same way -- on an arm64 machine.
  linux-musl-arm64:
    name: Linux arm64 static musl (reproducible, built twice)
    runs-on: ubuntu-24.04-arm
    needs: guard
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.tag }}
          fetch-depth: 1

      - name: Install podman
        run: bash scripts/ci_apt.sh podman

      # No VAES-equivalent variant exists for ARM, deliberately: it would require
      # the ARMv8 Crypto Extensions, which the Raspberry Pi does not have.
      - name: Reproducible build, asserting A == B
        run: bash packaging/reproducible-build.sh

      - name: Name the artifact for the release page
        env:
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          mv packaging/out/nkct \
             "packaging/out/nkct-${TAG}-aarch64-unknown-linux-musl"
          rm -f packaging/out/SHA256SUMS
          ls -l packaging/out/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: linux-musl-arm64
          path: packaging/out/nkct-*
          if-no-files-found: error

  # macOS universal binary. THIS ONE CARRIES A WEAKER GUARANTEE THAN THE TWO
  # LINUX ARTIFACTS, and the release notes say so: it is built natively on the
  # runner, not inside a digest-pinned container, so there is no byte-identity
  # assertion behind it and no recipe a third party can rerun to reproduce it.
  # Apple's SDK is not redistributable, which is what rules the container
  # approach out rather than any reluctance to do the work.
  macos:
    name: macOS universal (arm64 + x86_64)
    runs-on: macos-latest
    needs: guard
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.tag }}

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      # The action's `targets:` input installs into *stable*, while cargo
      # resolves to the 1.96.1 that rust-toolchain.toml pins -- so the std would
      # land in a toolchain nothing uses and the cross build would fail with
      # `E0463: can't find crate for core`. Running rustup inside the checkout
      # resolves the override. Same trap rust-toolchain.toml documents for
      # x86_64-pc-windows-msvc, and the same fix ci.yml uses.
      - name: Add the x86_64 Apple target to the PINNED toolchain
        run: rustup target add x86_64-apple-darwin

      # No RUSTFLAGS: the portable floors (apple-m1 / x86-64-v2+aes) come from
      # .cargo/config.toml, and an env RUSTFLAGS would replace those sections
      # rather than add to them.
      - name: Build both Apple targets
        run: |
          set -euo pipefail
          cargo build --release --locked --target aarch64-apple-darwin \
            --bin nkct --no-default-features --features backend-rustcrypto
          cargo build --release --locked --target x86_64-apple-darwin \
            --bin nkct --no-default-features --features backend-rustcrypto

      - name: lipo the two into one universal binary
        env:
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p out
          lipo -create \
            target/aarch64-apple-darwin/release/nkct \
            target/x86_64-apple-darwin/release/nkct \
            -output "out/nkct-${TAG}-universal-apple-darwin"
          lipo -info "out/nkct-${TAG}-universal-apple-darwin"
          ls -l out/

      # `lipo -info` reports what the container claims, not that either slice
      # runs. CI builds and tests the two halves separately and would otherwise
      # never execute the thing actually shipped, so a lipo that produced a
      # malformed binary would ship unnoticed. The runner is Apple Silicon, so
      # this exercises the arm64 slice; the x86_64 slice is covered by the
      # separate cross-build's own test run.
      - name: Smoke the universal binary that actually ships
        env:
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          chmod +x "out/nkct-${TAG}-universal-apple-darwin"
          "./out/nkct-${TAG}-universal-apple-darwin" --version

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: macos-universal
          path: out/nkct-*
          if-no-files-found: error

  windows:
    name: Windows x86_64-msvc (cross-built)
    runs-on: ubuntu-latest
    needs: guard
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.tag }}

      - name: Install Rust toolchain (+windows-msvc)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-windows

      - name: Install cargo-xwin toolchain
        # cargo-xwin itself is a host (linux-gnu) build, so it takes the ci.yml
        # override. The cross-build step below deliberately gets none.
        env:
          RUSTFLAGS: "-C target-cpu=x86-64-v2"
        run: |
          bash scripts/ci_apt.sh clang llvm lld
          cargo install --locked cargo-xwin

      - name: Cache the xwin Windows SDK/CRT
        uses: actions/cache@v6
        with:
          path: ~/.cache/cargo-xwin
          key: xwin-sdk-${{ runner.os }}

      # No RUSTFLAGS here, not even an empty one: the portable x86-64-v3 + AES-NI
      # floor comes from .cargo/config.toml's [target.x86_64-pc-windows-msvc]
      # section, and any value of the env var would replace it.
      - name: Cross-build the .exe
        run: >
          cargo xwin build --release --locked
          --target x86_64-pc-windows-msvc
          --bin nkct
          --no-default-features --features backend-rustcrypto

      - name: Name the artifact for the release page
        env:
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          mkdir -p out
          cp target/x86_64-pc-windows-msvc/release/nkct.exe \
             "out/nkct-${TAG}-x86_64-pc-windows-msvc.exe"
          ls -l out/

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: windows-msvc
          path: out/nkct-*
          if-no-files-found: error

  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [guard, linux-musl, linux-musl-arm64, macos, windows]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.tag }}

      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Hash the assets
        run: |
          set -euo pipefail
          cd dist
          sha256sum nkct-* > SHA256SUMS
          cat SHA256SUMS

      - name: Compose the release notes
        env:
          TAG: ${{ needs.guard.outputs.tag }}
          VERSION: ${{ needs.guard.outputs.version }}
        run: |
          set -euo pipefail
          X86_SHA=$(awk '/x86_64-unknown-linux-musl$/ {print $1}' dist/SHA256SUMS)
          ARM_SHA=$(awk '/aarch64-unknown-linux-musl$/ {print $1}' dist/SHA256SUMS)
          {
            case "$TAG" in
              *-*)
                echo "> **Release candidate.** Published to exercise the release"
                echo "> pipeline and the four artifacts before the real tag. Not"
                echo "> selected by \`cargo install nkct\` unless you ask for this"
                echo "> exact version."
                echo
                ;;
            esac
            echo "## Install"
            echo
            echo '```'
            echo "cargo install nkct --version ${VERSION} --locked"
            echo '```'
            echo
            echo "Or take a binary below. \`SHA256SUMS\` covers all of them."
            echo
            echo "| Platform | Artifact | Reproducible |"
            echo "|---|---|---|"
            echo "| Linux x86_64 | static musl | yes |"
            echo "| Linux arm64 | static musl | yes |"
            echo "| Windows x86_64 | \`.exe\` | no |"
            echo "| macOS | universal (arm64 + x86_64) | no |"
            echo
            echo "## Verifying the Linux binaries against this source"
            echo
            echo "Both are built by \`packaging/reproducible-build.sh\` inside a"
            echo "digest-pinned container, twice, from independent \`--no-cache\`"
            echo "builds asserted byte-identical. Rebuild from the tagged source"
            echo "and compare. **Verify on a machine of the same architecture**:"
            echo "the script picks its Containerfile from \`uname -m\`, because each"
            echo "one pins a base image for one architecture by digest."
            echo
            echo '```'
            echo "git checkout ${TAG}"
            echo "VARIANTS=nkct packaging/reproducible-build.sh"
            echo "sha256sum packaging/out/nkct"
            echo '```'
            echo
            echo "Expected on x86_64: \`${X86_SHA}\`"
            echo "Expected on arm64:  \`${ARM_SHA}\`"
            echo
            echo "(sha256 is over content, so the different filename on this page"
            echo "does not affect the comparison.)"
            echo
            echo "An AVX-512/VAES variant is a local opt-in x86_64 build, not"
            echo "released: see docs/guides/REPRODUCIBLE_BUILD.md. There is no ARM"
            echo "analogue, deliberately -- it would require the ARMv8 Crypto"
            echo "Extensions, which the Raspberry Pi does not have. The arm64"
            echo "artifact is built for the baseline without them, and was checked"
            echo "on a Pi 4 rather than only on CI, whose ARM runners do have them."
            echo
            echo "## The Windows and macOS binaries are NOT reproducible"
            echo
            echo "They are built natively on CI runners, not inside a pinned"
            echo "container, so no byte-identity assertion stands behind them and"
            echo "there is no recipe here you can rerun to reproduce them. If that"
            echo "matters for your threat model, use a Linux artifact or build from"
            echo "source. \`SHA256SUMS\` still lets you verify you received what"
            echo "this page published; it does not tell you what went into it."
            echo
            echo "## Changes"
            echo
            echo "See [CHANGELOG.md](https://github.com/${GITHUB_REPOSITORY}/blob/${TAG}/CHANGELOG.md)."
          } > notes.md
          cat notes.md

      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.guard.outputs.tag }}
        run: |
          set -euo pipefail
          # A tag carrying a pre-release suffix (v2.2.0-rc.1) must not become the
          # repository's "Latest release" -- that is the link every drive-by
          # visitor clicks, and a release candidate is not what they should get.
          PRERELEASE=""
          case "$TAG" in
            *-*) PRERELEASE="--prerelease" ;;
          esac
          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file notes.md \
            --verify-tag \
            $PRERELEASE \
            dist/nkct-* dist/SHA256SUMS

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: [guard, release]
    timeout-minutes: 30
    # Irreversible: a crates.io version number can never be reused. Give this
    # environment a required reviewer so the run pauses here for a human.
    environment: crates-io
    env:
      RUSTFLAGS: "-C target-cpu=x86-64-v2"
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.guard.outputs.tag }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install build deps
        run: bash scripts/ci_apt.sh pkg-config libssl-dev

      - name: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: cargo publish --locked
