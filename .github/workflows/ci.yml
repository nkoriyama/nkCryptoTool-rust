# Phase 4 F4 release-blocking CI workflow.
#
# Triggers: push to main + pull_request (NOT pull_request_target — F4-X10).
#
# Default permissions: contents: read only (F4-X11). Step-level escalation
# is intentional and minimal.
#
# Action pin policy (F4-X15):
#   - Standard widely-trusted actions (actions/checkout, actions/cache,
#     Swatinem/rust-cache, dtolnay/rust-toolchain) are pinned to major
#     version (@vN). They are de facto Rust ecosystem standards.
#   - Third-party / less-trusted actions would require commit SHA pin, but
#     no such actions are used in this workflow.
#
# Secrets: not used in this workflow. No echo/printf/cat of secrets occurs
# anywhere (F4-X12).
#
# Caching strategy (F4-R8 + Gemini Trigger 1 §3.4#2):
#   - Swatinem/rust-cache@v2 covers ~/.cargo registry + target/ artifacts
#   - apt cache for Slint / Iroh system deps via actions/cache
#   - sccache could be added in v2.2 if compile time becomes a bottleneck

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# .cargo/config.toml pins the linux-gnu target to `target-cpu=native
# -Ctarget-feature=+vaes` for local dev. GitHub runners without VAES SIGILL when
# rustc runs a proc-macro / build script compiled with those flags, so pin CI to
# a portable floor here (RUSTFLAGS wins over the config; local dev sets no
# RUSTFLAGS and keeps its native tuning).
env:
  RUSTFLAGS: "-C target-cpu=x86-64-v2"

jobs:
  # Linux: full build + test + clippy + mandate_check (release-blocking)
  test-linux:
    name: Test (Linux, full)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # mandate_check.sh needs git log against v2.0.4
          # Check out the PR branch head, not GitHub's synthetic merge ref.
          # The merge ref adds a merge commit that mandate_check's linear-history
          # check would otherwise count; on push events this falls back to the
          # pushed commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Cache apt packages (Slint + Iroh deps)
        uses: actions/cache@v6
        with:
          path: |
            /var/cache/apt/archives/*.deb
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/ci.yml') }}

      - name: Install Slint / Iroh / OpenSSL system deps
        # Via scripts/ci_apt.sh — see that script's header for the 2026-08-18
        # mirror stall it exists to survive.
        run: |
          bash scripts/ci_apt.sh \
            libfontconfig1-dev \
            libxcb1-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libgtk-3-dev \
            libssl-dev \
            pkg-config

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-stable

      - name: Mandate check (pre-flight)
        run: bash scripts/mandate_check.sh

      - name: cargo build (full features, vendored openssl)
        # Use backend-openssl-vendored to bypass ubuntu-latest libssl3
        # idiosyncrasies in EVP_PKEY_Q_keygen for prime256v1 (observed in
        # F4 CI: works in distrobox build-env Fedora libssl, fails on
        # ubuntu-latest at runtime). Tracked in PHASE5_ROADMAP §3.1 for
        # cross-platform native libssl resolution.
        run: |
          cargo build --no-default-features --features "backend-openssl-vendored gui-camera gui-notifications gui-screen-protection gui-file-transfer"

      # Release-blocking (P1-R4): a non-zero clippy exit fails the job.
      # `-D warnings` is intentionally NOT set — there is pre-existing clippy
      # warning debt in src/utils.rs, src/backend/, etc. (60+ warnings, cleanup
      # tracked in PHASE5_ROADMAP §5). Without -D warnings those remain
      # non-fatal, but any clippy ERROR (e.g. a deny-by-default correctness
      # lint) or compile failure now blocks the release as intended.
      - name: cargo clippy (release-blocking)
        run: |
          cargo clippy --all-targets --no-default-features \
            --features "testing backend-openssl-vendored gui-camera gui-notifications gui-screen-protection gui-file-transfer"

      - name: cargo test (gui_test + integration, vendored openssl)
        run: |
          cargo test --no-default-features \
            --features "testing backend-openssl-vendored gui-camera gui-notifications gui-screen-protection gui-file-transfer"

      # Run #[ignore]'d tests (notably src/network/iroh.rs internal tests
      # using a tight 2s handshake_timeout that is flaky on slow CI runners).
      # Advisory only — surfaces results without blocking release. Tracked
      # for proper resolution in PHASE5_ROADMAP §3.3.
      - name: cargo test --ignored (advisory, slow PQC handshake tests)
        continue-on-error: true  # F4-X13 explicit allowance
        run: |
          cargo test --no-default-features \
            --features "testing backend-openssl-vendored gui-camera gui-notifications gui-screen-protection gui-file-transfer" \
            --lib -- --ignored

  # Windows: build (release-blocking) + clippy/test (advisory during rollout).
  #
  # The earlier windows blocker was openssl-sys. It disappears with the default
  # pure-Rust `backend-rustcrypto` (no OpenSSL): we build --no-default-features
  # --features backend-rustcrypto (core crypto + p2p + shell, no GUI). ring's
  # x86_64 asm needs nasm, which windows-latest lacks, so install it.
  #
  # build is release-blocking (the whole crate — incl. the crypto path and the
  # portable-pty/ConPTY shell — is verified to compile for windows). clippy and
  # test are advisory (continue-on-error) while windows is new: some tests still
  # assume unix (paths / permissions). The file-security hardening (owner-only
  # DACL + reparse refusal, src/secure_fs.rs) IS windows-native now and its
  # tests run as a release-blocking step below; the remaining documented
  # degradation is core-dump suppression (OS/WER-level, out of process scope).
  #
  # macOS is brought up below (`test-macos`), advisory-only for now — the
  # same rollout the windows job went through.
  test-windows:
    name: Build (Windows, rustcrypto)
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install nasm (ring x86_64 asm)
        shell: pwsh
        run: |
          choco install nasm -y
          "C:\Program Files\NASM" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-stable

      - name: cargo build (pure-Rust backend, no OpenSSL/GUI) — release-blocking
        run: cargo build --no-default-features --features backend-rustcrypto

      - name: cargo clippy (advisory during windows rollout)
        continue-on-error: true  # F4-X13 explicit allowance
        run: cargo clippy --no-default-features --features "testing backend-rustcrypto"

      - name: cargo test (advisory — some tests still assume unix)
        continue-on-error: true  # F4-X13 explicit allowance
        run: cargo test --no-default-features --features "testing backend-rustcrypto"

      # The windows file-security hardening (owner-only DACL + reparse-point
      # refusal in src/secure_fs.rs, and the scp confinement real-path re-check
      # via GetFinalPathNameByHandleW) is release-blocking: these tests exercise
      # the real NTFS ACL / symlink / junction semantics that Wine cannot
      # emulate, so this native-runner step is the only place they are actually
      # verified. The two trailing args are OR'd libtest name filters.
      - name: cargo test hardening (release-blocking — native windows ACL/reparse/junction semantics)
        run: cargo test --no-default-features --features backend-rustcrypto -- --nocapture secure_fs windows_confine

  # macOS bring-up. ADVISORY ONLY -- every step is continue-on-error, exactly as
  # the windows job was during its own rollout (F4-X13 allowance).
  #
  # WHY THIS IS ADVISORY AND NOT RELEASE-BLOCKING YET
  # -------------------------------------------------
  # macOS had never been built by CI at all. The note this job replaces deferred
  # it over a "ring 0.17 aarch64-darwin build issue" and recorded nothing further
  # -- no advisory number, no error, no entry in KNOWN_ISSUES.md. ring is 0.17.14
  # here and ships pregenerated aarch64 asm, so the note may simply be stale, or
  # may have been about cross-building rather than a native runner. There is no
  # way to tell without running it, and a first run that reddens main for
  # everyone is the wrong way to find out.
  #
  # Promote the build step to release-blocking (drop its continue-on-error) once
  # this has been green for a few runs; the release workflow must not ship a
  # macOS binary before that happens.
  #
  # macOS is a first-class target in the code, not an afterthought: the scp
  # path-confinement re-check in src/scp.rs uses F_GETPATH on macOS as the peer
  # of Linux's /proc/self/fd, and `recheck_fd_confined` fails closed on every
  # platform that has neither. That is the behaviour these tests are here to
  # keep honest.
  test-macos:
    name: Build (macOS, rustcrypto) — advisory
    runs-on: macos-latest  # Apple Silicon
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain (stable, +x86_64-apple-darwin)
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: x86_64-apple-darwin

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-stable

      # No RUSTFLAGS override: unlike the linux-gnu section, the Apple targets in
      # .cargo/config.toml already carry a portable floor (apple-m1 /
      # x86-64-v2+aes), and an env RUSTFLAGS would replace it rather than add to
      # it. No nasm either — ring ships pregenerated asm for both Apple targets.
      - name: cargo build (arm64, pure-Rust backend, no OpenSSL/GUI)
        continue-on-error: true  # F4-X13 explicit allowance — see job comment
        run: cargo build --no-default-features --features backend-rustcrypto

      # Proves the second half of the universal binary the release workflow will
      # produce with lipo. Cross-compiled from the arm64 runner using the same
      # Xcode SDK, so it needs no extra tooling.
      - name: cargo build (x86_64 cross, for the universal binary)
        continue-on-error: true  # F4-X13 explicit allowance — see job comment
        run: cargo build --no-default-features --features backend-rustcrypto --target x86_64-apple-darwin

      - name: cargo clippy
        continue-on-error: true  # F4-X13 explicit allowance — see job comment
        run: cargo clippy --no-default-features --features "testing backend-rustcrypto"

      # Includes the scp confinement suite, which is where F_GETPATH is actually
      # exercised. Advisory for now; this is the step whose result decides
      # whether a macOS release artifact is defensible.
      - name: cargo test
        continue-on-error: true  # F4-X13 explicit allowance — see job comment
        run: cargo test --no-default-features --features "testing backend-rustcrypto"

  # Release-blocking: a RUSTSEC advisory against a dependency fails the run.
  #
  # This was `continue-on-error: true` until 2026-08-19, which meant the only
  # job that looks at the dependency graph reported real vulnerabilities without
  # being able to stop anything. It did exactly that for RUSTSEC-2026-0258 (h2,
  # unbounded empty DATA frames) — the advisory was live on `main`, the job was
  # red, and nothing surfaced it; the bump in `ad8f27d2` happened because a
  # person happened to read the job output. Finding a live advisory should not
  # depend on someone looking.
  #
  # The old comment's worry — "some advisories may be transitively unfixable" —
  # is real, and `.cargo/audit.toml` is the answer to it: an ignore there needs a
  # written rationale and a review date, so an unfixable advisory is a recorded
  # decision instead of a silently red job. Two are ignored that way today
  # (RUSTSEC-2026-0194/0195, quick-xml, unreachable from the P2P wire path).
  #
  # Verified before flipping it: `cargo audit` exits 0 at this revision, and
  # exits 1 at 50078278 — i.e. this gate would have caught h2.
  audit:
    name: cargo audit (release-blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Rust toolchain (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Run cargo audit
        run: cargo audit
