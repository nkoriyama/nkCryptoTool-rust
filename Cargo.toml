[package]
name = "nk-crypto-tool"
version = "2.1.0"
edition = "2021"
license = "MIT"

[dependencies]
tokio = { version = "1.0", features = ["full"] }
openssl = { version = "0.10", optional = true }
openssl-sys = { version = "0.9", optional = true }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
fips203 = "0.4"
fips204 = "0.4"
sha3 = { version = "0.10", features = ["zeroize"] }
sha2 = "0.10"
hkdf = "0.12"
base64 = "0.21"
pkcs8 = { version = "0.10", features = ["encryption"] }
spki = "0.7"
der = "0.7"
foreign-types = { version = "0.3", optional = true }
openssl-src = { version = "300.6", optional = true }
zeroize = { version = "1.0", features = ["derive"] }
rpassword = "7.2"
libc = "0.2"
tempfile = "3.8"
parking_lot = "0.12"
hex = "0.4"
serial_test = "3.0"
slint = { version = "1.16", optional = true }
arboard = { version = "3.4", optional = true }
nokhwa = { version = "0.10", optional = true, features = ["input-native", "output-threaded"] }
rqrr = { version = "0.6", optional = true }
image = { version = "0.24", optional = true }

# MLS group chat (opt-in via `--features mls`). See MLS_GROUP_CHAT_PLAN.md.
mls-rs = { version = "0.55", optional = true }
mls-rs-core = { version = "0.27", optional = true }
mls-rs-codec = { version = "0.7", optional = true }
mls-rs-crypto-traits = { version = "0.22", optional = true }
mls-rs-crypto-openssl = { version = "0.21", optional = true }
# `mls-rs-crypto-hpke` is a transitive dep of `mls-rs-crypto-openssl`,
# but we depend on it directly to access `kem_combiner::xwing::CombinedKem`
# and `kem_combiner::FixedLengthKemType` for the hybrid KEM composition
# (X25519 ‖ ML-KEM-768). Version must track openssl provider's; bump together.
mls-rs-crypto-hpke = { version = "0.21", optional = true }
# P2 sqlite persistence with SQLCipher at-rest encryption.
# `sqlcipher-bundled` builds the SQLCipher 4 C library (AES-256-CBC +
# HMAC-SHA512, PBKDF2-HMAC-SHA512 with 256 000 iterations) and pulls
# rusqlite's `bundled-sqlcipher` feature transitively. The MLS sqlite
# file is encrypted with a user-supplied passphrase configured via
# `PRAGMA key` on every connection (see `TunedFileStrategy` in
# `src/group/storage.rs`). File mode `0o600` remains as defence in
# depth. See SECURITY_PROFILE.md §7.3.
mls-rs-provider-sqlite = { version = "0.23", default-features = false, features = ["sqlcipher-bundled"], optional = true }
# Direct rusqlite dep so our custom `ConnectionStrategy` can apply the
# `key`, busy_timeout, and synchronous PRAGMAs that the upstream provider
# does not set. `bundled-sqlcipher` keeps us on the same C library as
# `mls-rs-provider-sqlite` (cargo unifies the underlying `libsqlite3-sys`
# build). Version must match `mls-rs-provider-sqlite`'s pin (0.37).
rusqlite = { version = "0.37", default-features = false, features = ["bundled-sqlcipher"], optional = true }
notify-rust = { version = "4.0", optional = true }
rfd = { version = "0.14", optional = true }

# RustCrypto ecosystem
aes-gcm = { version = "0.10", optional = true, features = ["zeroize"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pem", "pkcs8"], optional = true }
ecdsa = { version = "0.16", optional = true }
signature = { version = "2.2", optional = true }
rand_core = { version = "0.6", features = ["getrandom"] }

# Low-level primitives for streaming GCM
aes = { version = "0.8", features = ["zeroize"], optional = true }
ctr = { version = "0.9", features = ["zeroize"], optional = true }
ghash = { version = "0.5", features = ["zeroize"], optional = true }
subtle = { version = "2.5", optional = true }
generic-array = { version = "0.14", optional = true }
chacha20poly1305 = "0.10.1"
chacha20 = { version = "0.9", features = ["zeroize"] }
poly1305 = { version = "0.8", features = ["zeroize"] }
once_cell = "1.21.4"
iroh = { version = "0.91", features = ["discovery-local-network"] }
iroh-base = { version = "0.91", features = ["key", "relay"] }
iroh-relay = "0.91"
data-encoding = "2.4"
qrcode = "0.12"
crc = "3.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", optional = true, features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_SystemInformation"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.5", optional = true }

[build-dependencies]
slint-build = { version = "1.16", optional = true }

[features]
default = ["backend-openssl"]
gui = ["slint", "slint-build", "arboard"]
testing = []
gui-camera = ["gui", "nokhwa", "rqrr", "image"]
gui-notifications = ["gui", "notify-rust"]
gui-screen-protection = ["gui", "windows", "objc2"]
gui-file-transfer = ["gui", "rfd"]
# MLS group chat GUI (P8). Adds the GroupChatWindow Slint component and
# its Rust driver on top of the base `gui` + `mls` feature combination.
gui-mls = ["gui", "mls"]
backend-openssl = ["openssl", "openssl-sys", "foreign-types"]
backend-openssl-vendored = ["backend-openssl", "openssl/vendored", "openssl-src"]
backend-rustcrypto = [
    "aes-gcm",
    "p256",
    "ecdsa",
    "signature",
    "aes",
    "ctr",
    "ghash",
    "subtle",
    "generic-array",
]

# MLS group chat (P1: non-PQC base passthrough). P1.5 adds PQC adapter.
# Off by default; enable explicitly with `--features mls`.
# Requires the OpenSSL backend: the at-rest/rollback layer (group::at_rest,
# group::rollback) uses `openssl::` directly and the suite uses
# mls-rs-crypto-openssl, so `mls` pulls in `backend-openssl` even under
# `--no-default-features` (it is not compatible with rustcrypto-only).
mls = [
    "backend-openssl",
    "mls-rs",
    "mls-rs-core",
    "mls-rs-codec",
    "mls-rs-crypto-traits",
    "mls-rs-crypto-openssl",
    "mls-rs-crypto-hpke",
    "mls-rs-provider-sqlite",
    "rusqlite",
]

[dev-dependencies]
i-slint-backend-testing = "=1.16.1"
