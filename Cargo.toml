[package]
name = "nk-crypto-tool"
version = "2.1.0"
edition = "2021"
license = "MIT"

[lints.rust]
# `aes_backend` is the aes crate's backend-selection cfg (avx256/avx512 VAES);
# our main() reads it for the VAES-variant startup CPU guard. Declare it so
# check-cfg does not flag the guard as an unknown cfg.
unexpected_cfgs = { level = "warn", check-cfg = [
    'cfg(aes_backend, values("avx256", "avx512"))',
] }

# `rlib` keeps the normal Rust library (used by the bin and integration tests);
# `cdylib` additionally emits a C-ABI shared library (`libnk_crypto_tool.so`) so
# the chat/crypto core can be loaded from a mobile app via JNI/UniFFI. See
# BUILD_ANDROID.md.
[lib]
crate-type = ["rlib", "cdylib"]

# uniffi-bindgen CLI for generating Kotlin/Swift bindings. Only built with the
# `mobile-ffi` feature so normal builds don't pull the uniffi CLI deps.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"
required-features = ["mobile-ffi"]

[dependencies]
tokio = { version = "1.0", features = ["full"] }
openssl = { version = "0.10", optional = true }
openssl-sys = { version = "0.9", optional = true }
clap = { version = "4.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
anyhow = "1.0"
async-trait = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
fips203 = "0.4"
fips204 = "0.4"
sha3 = { version = "0.10", features = ["zeroize"] }
sha2 = "0.10"
hkdf = "0.12"
base64 = "0.21"
pkcs8 = { version = "0.10", features = ["encryption"] }
spki = "0.8"
der = "0.7"
foreign-types = { version = "0.3", optional = true }
openssl-src = { version = "400.0", optional = true }
zeroize = { version = "1.0", features = ["derive"] }
rpassword = "7.2"
libc = "0.2"
tempfile = "3.8"
parking_lot = "0.12"
hex = "0.4"
slint = { version = "1.16", optional = true }
arboard = { version = "3.4", optional = true }
nokhwa = { version = "0.10", optional = true, features = ["input-native", "output-threaded"] }
rqrr = { version = "0.6", optional = true }
image = { version = "0.24", optional = true }

# MLS group chat (opt-in via `--features mls`). See MLS_GROUP_CHAT_PLAN.md.
mls-rs = { version = "0.55", optional = true }
mls-rs-core = { version = "0.27", optional = true }
mls-rs-codec = { version = "0.7", optional = true }
mls-rs-crypto-traits = { version = "0.22", optional = true }
mls-rs-crypto-openssl = { version = "0.21", optional = true }
# `mls-rs-crypto-hpke` is a transitive dep of `mls-rs-crypto-openssl`,
# but we depend on it directly to access `kem_combiner::xwing::CombinedKem`
# and `kem_combiner::FixedLengthKemType` for the hybrid KEM composition
# (X25519 ‖ ML-KEM-768). Version must track openssl provider's; bump together.
mls-rs-crypto-hpke = { version = "0.21", optional = true }
# P2 sqlite persistence with SQLCipher at-rest encryption.
# `sqlcipher-bundled` builds the SQLCipher 4 C library (AES-256-CBC +
# HMAC-SHA512, PBKDF2-HMAC-SHA512 with 256 000 iterations) and pulls
# rusqlite's `bundled-sqlcipher` feature transitively. The MLS sqlite
# file is encrypted with a user-supplied passphrase configured via
# `PRAGMA key` on every connection (see `TunedFileStrategy` in
# `src/group/storage.rs`). File mode `0o600` remains as defence in
# depth. See SECURITY_PROFILE.md §7.3.
mls-rs-provider-sqlite = { version = "0.23", default-features = false, features = ["sqlcipher-bundled"], optional = true }
# Direct rusqlite dep so our custom `ConnectionStrategy` can apply the
# `key`, busy_timeout, and synchronous PRAGMAs that the upstream provider
# does not set. `bundled-sqlcipher` keeps us on the same C library as
# `mls-rs-provider-sqlite` (cargo unifies the underlying `libsqlite3-sys`
# build). Version must match `mls-rs-provider-sqlite`'s pin (0.37).
rusqlite = { version = "0.37", default-features = false, features = ["bundled-sqlcipher"], optional = true }
notify-rust = { version = "4.0", optional = true }
rfd = { version = "0.14", optional = true }

# Pure-Rust embedded KV store backing the SQLCipher replacement (P1, see
# DB_PURERUST_DESIGN.md). Removes the system libcrypto link that
# `bundled-sqlcipher` pulls in, so the `mls` storage layer can cross-compile
# to Android/iOS with no C crypto dependency. Values are encrypted at the
# application layer with XChaCha20-Poly1305 (see `group::redb_storage`).
redb = { version = "4" }

# UniFFI: generates Kotlin/Swift bindings from `#[uniffi::export]` so the chat /
# crypto core can be called from a mobile app. Opt-in via `mobile-ffi`; compiled
# into the cdylib (see BUILD_ANDROID.md). `cli` powers the uniffi-bindgen bin.
uniffi = { version = "0.32", optional = true, features = ["cli", "tokio"] }

# RustCrypto ecosystem
aes-gcm = { version = "0.11", optional = true, features = ["zeroize"] }
p256 = { version = "0.13", features = ["ecdh", "ecdsa", "pem", "pkcs8"], optional = true }
rand_core = { version = "0.6", features = ["getrandom"] }

# Pure-Rust classical primitives for the OpenSSL-free MLS cipher suite
# (X25519 + Ed25519) and the at-rest KDF/MAC. These replace what
# `mls-rs-crypto-openssl` and `openssl::{pkcs5,symm,hash}` used to provide, so
# the `mls` feature can build/link on mobile (Android/iOS) with zero OpenSSL.
x25519-dalek = { version = "2", optional = true, features = ["static_secrets"] }
ed25519-dalek = { version = "2", optional = true, features = ["rand_core"] }
pbkdf2 = { version = "0.12", optional = true }
hmac = { version = "0.12", optional = true }

# AEAD for the v3 chunked file format, P2P frames, and the MLS cipher suite.
# (The low-level `aes`/`ctr`/`ghash`/`subtle`/`generic-array`/`chacha20`/`poly1305`
# crates that backed the hand-rolled streaming AEAD were dropped with it in the
# M5 audit fix — the vetted `aes-gcm`/`chacha20poly1305` one-shot APIs are the
# only AEAD path now, and they pull their own low-level deps transitively.)
chacha20poly1305 = "0.11"
once_cell = "1.21.4"
iroh = { version = "1.0" }
iroh-base = { version = "1.0", features = ["key", "relay"] }
iroh-relay = "1.0"
data-encoding = "2.4"
qrcode = "0.12"
crc = "3.0"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.52", optional = true, features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation", "Win32_System_SystemInformation"] }
# Console raw-mode + size for the interactive shell *client* on Windows (the
# counterpart to termios on unix). Always-on on Windows (the shell client is
# desktop-only). See src/shell.rs (RawModeGuard / term_size, cfg(windows)).
windows-sys = { version = "0.59", features = ["Win32_System_Console", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading", "Win32_System_Memory"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.5", optional = true }

# The interactive P2P shell (PTY bridge) is desktop-only: unix excluding mobile,
# plus windows. portable-pty unifies openpty (unix) and ConPTY (windows) behind
# one API. Gated to the same target set as the `shell_desktop` cfg in build.rs so
# mobile (android/ios) and other targets never pull it (they use an error stub).
[target.'cfg(any(all(unix, not(target_os = "android"), not(target_os = "ios")), windows))'.dependencies]
portable-pty = "0.8"

[build-dependencies]
slint-build = { version = "1.16", optional = true }

[features]
default = ["backend-rustcrypto"]
gui = ["slint", "slint-build", "arboard"]
testing = []
gui-camera = ["gui", "nokhwa", "rqrr", "image"]
gui-notifications = ["gui", "notify-rust"]
gui-screen-protection = ["gui", "windows", "objc2"]
gui-file-transfer = ["gui", "rfd"]
# MLS group chat GUI (P8). Adds the GroupChatWindow Slint component and
# its Rust driver on top of the base `gui` + `mls` feature combination.
gui-mls = ["gui", "mls"]
backend-openssl = ["openssl", "openssl-sys", "foreign-types"]
backend-openssl-vendored = ["backend-openssl", "openssl/vendored", "openssl-src"]
backend-rustcrypto = [
    "aes-gcm",
    "p256",
]

# MLS group chat (P1: non-PQC base passthrough). P1.5 adds PQC adapter.
# Off by default; enable explicitly with `--features mls`.
# Fully pure-Rust (no OpenSSL): the cipher suite is built in-repo on RustCrypto
# primitives (see `group::crypto_adapter::rc_*`) and the at-rest/rollback layer
# uses `pbkdf2`/`aes-gcm`/`sha2`. This lets `mls` build/link on mobile. It is
# compatible with either default backend; the mobile target is
# `--no-default-features --features "backend-rustcrypto mls"`.
# Backend-agnostic MLS core: the mls-rs crates + our pure-Rust hybrid cipher
# suite, with NO storage backend. Both `mls` (sqlite) and `mls-redb` (pure-Rust
# redb) build on this. Splitting it out lets `mls-redb` link without the
# SQLCipher/libcrypto dependency that `mls` pulls in.
mls-base = [
    "mls-crypto-rustcrypto",
    "mls-rs",
    "mls-rs-core",
    "mls-rs-codec",
    "mls-rs-crypto-traits",
    "mls-rs-crypto-hpke",
]
# MLS with the pure-Rust redb storage backend (default). Links no SQLCipher /
# libcrypto, so it cross-compiles to Android/iOS. See DB_PURERUST_DESIGN.md.
mls = [
    "mls-base",
    "hmac",
]
# Adds the legacy SQLCipher reader for the one-time `migrate-from-sqlcipher`
# tool (P3). Pulls rusqlite + the sqlite provider (hence system libcrypto), so
# it is opt-in and excluded from normal / mobile builds.
legacy-sqlcipher-migration = [
    "mls",
    "mls-rs-provider-sqlite",
    "rusqlite",
]

# Pure-Rust crypto bundle backing the `mls` cipher suite + at-rest layer.
# (sha2/sha3/hkdf/fips203/fips204 are non-optional deps, so they need no
# listing here — only the genuinely-optional crates are enabled.)
mls-crypto-rustcrypto = [
    "aes-gcm",
    "x25519-dalek",
    "ed25519-dalek",
    "pbkdf2",
    "hmac",
]

# Deprecated alias — `mls` is now the pure-Rust redb backend itself. Kept so
# existing `--features mls-redb` invocations keep working.
mls-redb = ["mls"]

# Mobile FFI: UniFFI-exported surface over the MLS chat / crypto core, built
# into the cdylib for Kotlin/Swift consumption. See src/ffi.rs, BUILD_ANDROID.md.
mobile-ffi = ["uniffi", "mls"]

[dev-dependencies]
i-slint-backend-testing = "=1.16.1"
serial_test = "3.0"
# `test-util` (not part of tokio's `full`) provides the pausable clock, so
# timeout-bounded admission control can be tested without sleeping in real time.
tokio = { version = "1.0", features = ["full", "test-util"] }
